name: DF Motion CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-11 g++-11 libxml-libxslt-perl zip

      - name: Check out pinned DFHack
        run: |
          git clone --depth 1 --branch 53.16-r1.1 --recurse-submodules https://github.com/DFHack/dfhack.git dfhack

      - name: Add DF Motion to DFHack
        run: |
          mkdir -p dfhack/plugins/external/smooth-movement
          cp CMakeLists.txt smooth-movement.cpp test_visual_animation_manager.cpp visual_animation.h dfhack/plugins/external/smooth-movement/

      - name: Build and test Linux
        run: |
          cmake -S dfhack -B dfhack/build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF
          cmake --build dfhack/build/linux --target smooth-movement smooth-movement-test
          dfhack/build/linux/plugins/external/smooth-movement/smooth-movement-test

      - name: Build Windows plugin
        run: (cd dfhack/build && ./build-win64-from-linux.sh)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp dfhack/build/linux/plugins/external/smooth-movement/smooth-movement.plug.so artifacts/
          cp dfhack/build/win64-cross/output/hack/plugins/smooth-movement.plug.dll artifacts/
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: df-motion-${{ github.sha }}
          path: artifacts/
